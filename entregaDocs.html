<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tareas Entregadas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background: linear-gradient(rgba(44, 82, 52, 0.7), rgba(44, 82, 52, 0.8)), 
                  url('img/background-image.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      background-color: white;
    }
    .card-header {
      background-color: #2C5234 !important;
      color: white !important;
      border-radius: 12px 12px 0 0 !important;
    }
    .btn-primary, .btn-success {
      background-color: #9C8412 !important;
      border: none !important;
    }
    .btn-primary:hover, .btn-success:hover {
      background-color: #8a7310 !important;
    }
    .btn-light {
      background-color: white;
      border: 1px solid #dee2e6;
      color: #2C5234;
      font-weight: 500;
    }
    .btn-light:hover {
      background-color: #f8f9fa;
      border-color: #2C5234;
      color: #2C5234;
    }
    h4 {
      color: white;
      font-weight: 600;
    }
    .table-light th {
      color: black !important;
      font-weight: bold;
    }
    .table td {
      color: #2C5234;
      font-weight: 500;
    }
    .table tbody tr:hover {
      background-color: rgba(156, 132, 18, 0.1);
    }
    #usuarioActivo {
      background-color: rgba(255,255,255,0.2);
      padding: 5px 10px;
      border-radius: 15px;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="container mt-5 mb-4">
    <div class="card shadow">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0" id="tituloTareas">Tareas Entregadas</h4>
        <div class="d-flex align-items-center gap-2">
          <span id="usuarioActivo" class="me-2 small"></span>
          <button id="btnVolver" class="btn btn-light btn-sm d-none">⬅️ Volver al panel</button>
        </div>
      </div>

      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered align-middle text-center">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Alumno</th>
                <th>Materia</th>
                <th>Tarea</th>
                <th>Fecha de Entrega</th>
                <th>Archivo</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tablaTareas"></tbody>
          </table>
        </div>
        <div id="mensaje" class="mt-3"></div>
      </div>
    </div>
  </div>

<script>
  // Obtener el usuario de sesión
  const usuario = JSON.parse(localStorage.getItem("usuario"));
  const usuarioRevisadoID = localStorage.getItem("usuarioRevisado");

  if (!usuario) window.location.href = "login.html";

  document.getElementById("usuarioActivo").textContent =
    `👤 ${usuario.nombre} (${usuario.rol})`;

  // Configurar título para coordinador revisando docentes
  if (usuario.rol === "coordinador" && usuarioRevisadoID) {
    fetch(`http://localhost:3000/api/usuarios/${usuarioRevisadoID}`)
      .then(res => res.json())
      .then(u => {
        document.getElementById("tituloTareas").textContent =
          `Tareas Entregadas – ${u.Nombre}`;
        document.getElementById("btnVolver").classList.remove("d-none");
        document.getElementById("btnVolver").onclick = () => {
          localStorage.removeItem("usuarioRevisado");
          window.location.href = "usuarios.html";
        };
      });
  } else {
    document.getElementById("tituloTareas").textContent =
      `Tareas Entregadas – ${usuario.nombre}`;
  }

  // Cargar tareas desde API
  async function cargarTareas() {
    try {
      Swal.fire({
        title: "Cargando tareas...",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      const res = await fetch("http://localhost:3000/api/tareas/entregadas");
      const tareas = await res.json();
      Swal.close();

      const tabla = document.getElementById("tablaTareas");
      tabla.innerHTML = "";

      if (!tareas.length) {
        document.getElementById("mensaje").innerHTML =
          `<div class="alert alert-warning text-center">No hay tareas entregadas aún.</div>`;
        return;
      }

      tareas.forEach((t, i) => {
        tabla.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${t.alumno}</td>
            <td>${t.materia}</td>
            <td>${t.titulo}</td>
            <td>${t.fecha_entrega}</td>
            <td>
              <a href="${t.archivo}" target="_blank" class="btn btn-primary btn-sm">📄 Ver</a>
            </td>
            <td>
              <button class="btn btn-success btn-sm" onclick="verDetalles(${t.id})">🔍 Detalles</button>
            </td>
          </tr>
        `;
      });

    } catch (err) {
      Swal.fire("Error", err.message, "error");
    }
  }

  // Ver detalles con SweetAlert
  function verDetalles(id) {
    Swal.fire({
      icon: "info",
      title: "Detalles de la tarea",
      text: `Aquí puedes mostrar los detalles de la tarea con ID: ${id}`,
      confirmButtonColor: "#9C8412",
    });
  }

  window.addEventListener("DOMContentLoaded", cargarTareas);
</script>

</body>
</html>
